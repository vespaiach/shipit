# /etc/shipit/apps/<app>.conf (root:root, 644, no secrets). `shipit deploy` writes it on an app's
# first deploy. Edit it, then run `sudo shipit deploy <app>` to apply the change.
REPO=git@github.com:vespaiach/tracklite.git
BRANCH=main
DOMAIN=tracklite.example.com
PORT=3001
DATABASE=tracklite          # optional; empty means no database
HEALTH_FAIL=report          # report (default) | rollback
LOG_REDACT_QUERY="token"    # optional; query parameters removed from the access log

# Backups (optional). BACKUP is what `shipit backup` and the daily timer save to
# /var/backups/shipit/<app>/, keeping host.conf's BACKUP_KEEP files:
#   postgres  pg_dump of DATABASE (the default when DATABASE is set)
#   state     a .tar.gz of the app's state folder, /var/lib/<app>
#   none      no backups (the default when DATABASE is empty)
# BACKUP_PATHS lists paths inside /var/lib/<app> to archive, separated by spaces; empty means the whole
# folder. Copying a live SQLite database (WAL mode) isn't safe: have the app write snapshots (VACUUM
# INTO a temp file, then rename it) before 03:00 UTC, and list those, for example:
#BACKUP=state
#BACKUP_PATHS="backups photos"

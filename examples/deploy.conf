# deploy.conf (optional, at the root of the app's repo). Without it, a Next.js app with
# package-lock.json deploys with zero config. Sourced by bash as deployer during a deploy and as the
# app user by the launcher; PORT is already set when it's sourced.
INSTALL="npm ci --no-audit --no-fund"
BUILD="npm run build"
MIGRATE="npm run db:migrate"            # optional
HEALTH_PATH=/health                     # optional; if set, health requires exactly 200
PROCESS_web="next start --hostname 127.0.0.1 --port $PORT"
PROCESS_worker="tsx --conditions=react-server scripts/worker.ts"

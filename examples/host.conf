# /etc/shipit/host.conf (root:root, 644, no secrets). `shipit setup` writes it on its first run and
# never rewrites it.
# ACME_EMAIL may be blank. No trailing comments: systemd reads this file too (EnvironmentFile).
ACME_EMAIL=owner@example.com
ADMIN_USER=root
NODE_MAJOR=24
SWAP_SIZE=4G
BACKUP_KEEP=14
LOG_KEEP_DAYS=14
MIN_FREE_DISK_GB=3
# Extra Debian packages setup installs, separated by spaces (blank by default). If npm ci fails while
# compiling a native module (better-sqlite3, sharp), set this, run sudo shipit setup, then redeploy:
#   EXTRA_PACKAGES="build-essential python3"
# Removing a name later doesn't uninstall the package.
EXTRA_PACKAGES=

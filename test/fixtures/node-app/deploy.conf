# The node-app fixture: two processes and a strict health path. Only web serves HTTP (on PORT).
# S4 adds MIGRATE, an SQL migration and a flag that makes it fail.
INSTALL="npm ci --no-audit --no-fund"
BUILD="npm run build"
HEALTH_PATH=/health                     # health requires exactly 200
PROCESS_web="node server.js"
PROCESS_worker="node worker.js"

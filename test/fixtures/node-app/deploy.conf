# The node-app fixture: two processes, a migration and a strict health path. Only web serves HTTP (on
# PORT). The migration fails when the repo has a file named FAIL_MIGRATION (see migrate.sh).
INSTALL="npm ci --no-audit --no-fund"
BUILD="npm run build"
MIGRATE="npm run db:migrate"
HEALTH_PATH=/health                     # health requires exactly 200
PROCESS_web="node server.js"
PROCESS_worker="node worker.js"

# shipit.ini (plan §3's full example; a static.root is left out: it's only for static sites)
[site]
domain = blog.example.com
alias = www.blog.example.com
type = nextjs
env = DATABASE_URL
env = NEXT_PUBLIC_API

[node]
install = pnpm install --frozen-lockfile
build = pnpm build
start = pnpm start

[data]
dir = uploads
dir = db
